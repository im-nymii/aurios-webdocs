name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Déclenché par un push sur Auri-OS/docs (voir le workflow côté contenu)
  repository_dispatch:
    types: [docs-updated]

permissions:
  contents: write
  pages: write
  id-token: write

# Un seul déploiement concurrent
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout theme
        uses: actions/checkout@v4

      - name: Checkout docs content
        uses: actions/checkout@v4
        with:
          repository: Auri-OS/docs
          ref: main
          path: .docs-content

      - name: Sync docs into _docs
        run: |
          rm -f _docs/*.md
          cp .docs-content/*.md _docs/

      - name: Commit updated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _docs
          if git diff --cached --quiet; then
            echo "No docs changes to commit."
          else
            git commit -m "docs: sync from Auri-OS/docs"
            git push
          fi

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build avec Jekyll
        run: bundle exec jekyll build --baseurl "/docs"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Git Pages deploiement
        id: deployment
        uses: actions/deploy-pages@v4
